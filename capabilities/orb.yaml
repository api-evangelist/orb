      name: alerts
      description: REST surface for alerts.
      operations:
      - method: GET
        name: listalerts
        description: List alerts
        call: orb.listalerts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/alerts/customer
      name: alerts-customer
      description: REST surface for alerts-customer.
      operations:
      - method: POST
        name: createcustomeralert
        description: Create a customer-level alert
        call: orb.createcustomeralert
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
