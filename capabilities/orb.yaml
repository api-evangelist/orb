      path: /alerts/customer
      operations:
      - name: createcustomeralert
        method: POST
        description: Create a customer-level alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: alerts-subscription
      path: /alerts/subscription
      operations:
      - name: createsubscriptionalert
        method: POST
        description: Create a subscription-level alert
        outputRawFormat: json
        outputParameters:
        - name: result
