naftiko: 1.0.0-alpha2
info:
  label: Orb API
  description: 'Orb API. 14 operations. Lead operation: List alerts. Self-contained Naftiko capability covering one Orb business
    surface.'
  tags:
  - Orb
  - Orb API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORB_API_KEY: ORB_API_KEY
capability:
