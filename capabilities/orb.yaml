          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: availability
      path: /availability
      operations:
      - name: checkavailability
        method: GET
        description: Test connection to the Orb API and check API key validity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
